<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォトライブラリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-primary: #1a73e8;
            --md-primary-hover: #1765cc;
            --md-primary-light: #e8f0fe;
            --md-secondary: #34a853;
            --md-error: #d93025;
            --md-warning: #fbbc04;
            --md-surface: #ffffff;
            --md-bg: #f8f9fa;
            --md-border: #dadce0;
            --md-text: #202124;
            --md-text-secondary: #5f6368;
            --md-text-hint: #80868b;
            --md-shadow-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --md-shadow-2: 0 2px 6px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.08);
            --md-shadow-3: 0 4px 12px rgba(0,0,0,0.15);
            --md-radius: 8px;
            --md-radius-lg: 12px;
            --md-radius-pill: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--md-bg);
            color: var(--md-text);
            min-height: 100vh;
        }

        /* ===== TOP APP BAR ===== */
        .app-bar {
            background: var(--md-surface);
            border-bottom: 1px solid var(--md-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--md-shadow-1);
        }

        .app-bar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-bar-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--md-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-bar-icon svg {
            width: 20px;
            height: 20px;
            color: var(--md-primary);
        }

        .app-bar-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--md-text);
            letter-spacing: -0.01em;
        }

        .app-bar-title span {
            color: var(--md-primary);
        }

        .app-bar-spacer { flex: 1; }

        .file-chip {
            background: var(--md-primary-light);
            color: var(--md-primary);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: var(--md-radius-pill);
        }

        /* ===== MAIN CONTENT ===== */
        .page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ===== UPLOAD CARD ===== */
        .upload-card {
            background: var(--md-surface);
            border-radius: var(--md-radius-lg);
            box-shadow: var(--md-shadow-1);
            border: 1px solid var(--md-border);
            padding: 32px;
            margin-bottom: 24px;
            transition: box-shadow 0.2s;
        }

        .upload-card:hover {
            box-shadow: var(--md-shadow-2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .card-header-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--md-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-header-icon svg {
            width: 18px;
            height: 18px;
            color: var(--md-primary);
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--md-text);
        }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed var(--md-border);
            border-radius: var(--md-radius);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--md-bg);
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--md-primary);
            background: var(--md-primary-light);
        }

        .drop-zone.drag-over::after {
            content: 'ここにドロップ';
            position: absolute;
            inset: 0;
            background: rgba(232, 240, 254, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--md-primary);
            border-radius: 6px;
        }

        .drop-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            background: var(--md-primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-icon svg {
            width: 26px;
            height: 26px;
            color: var(--md-primary);
        }

        .drop-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--md-text);
            margin-bottom: 6px;
        }

        .drop-hint {
            font-size: 13px;
            color: var(--md-text-secondary);
            margin-bottom: 20px;
        }

        .drop-hint .format-chips {
            display: inline-flex;
            gap: 6px;
            margin-top: 6px;
        }

        .format-chip {
            background: var(--md-surface);
            border: 1px solid var(--md-border);
            color: var(--md-text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: var(--md-radius-pill);
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-outlined {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 20px;
            border: 1px solid var(--md-border);
            border-radius: var(--md-radius-pill);
            background: var(--md-surface);
            color: var(--md-primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            letter-spacing: 0.01em;
        }

        .btn-outlined:hover {
            background: var(--md-primary-light);
            border-color: var(--md-primary);
        }

        .btn-outlined svg {
            width: 16px;
            height: 16px;
        }

        .btn-filled {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 24px;
            border: none;
            border-radius: var(--md-radius-pill);
            background: var(--md-primary);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            box-shadow: var(--md-shadow-1);
            letter-spacing: 0.01em;
        }

        .btn-filled:hover {
            background: var(--md-primary-hover);
            box-shadow: var(--md-shadow-2);
        }

        .btn-filled:disabled {
            background: var(--md-border);
            color: var(--md-text-hint);
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-filled svg {
            width: 16px;
            height: 16px;
        }

        input[type="file"] { display: none; }

        /* Selected file indicator */
        .selected-file {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding: 10px 14px;
            background: var(--md-primary-light);
            border-radius: var(--md-radius);
            border: 1px solid rgba(26, 115, 232, 0.2);
        }

        .selected-file.visible { display: flex; }

        .selected-file svg {
            width: 18px;
            height: 18px;
            color: var(--md-primary);
            flex-shrink: 0;
        }

        .selected-file-name {
            font-size: 13px;
            color: var(--md-primary);
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Progress */
        .progress-section {
            display: none;
            margin-top: 16px;
        }

        .progress-section.visible { display: block; }

        .progress-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--md-text-secondary);
            margin-bottom: 6px;
        }

        .md-progress {
            height: 4px;
            background: var(--md-border);
            border-radius: 2px;
            overflow: hidden;
        }

        .md-progress-fill {
            height: 100%;
            background: var(--md-primary);
            width: 0%;
            transition: width 0.1s;
            border-radius: 2px;
        }

        /* Snackbar */
        .snackbar {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #323232;
            color: #fff;
            font-size: 14px;
            font-weight: 400;
            padding: 12px 20px;
            border-radius: var(--md-radius);
            box-shadow: var(--md-shadow-3);
            z-index: 999;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            max-width: 90vw;
        }

        .snackbar.show {
            transform: translateX(-50%) translateY(0);
        }

        .snackbar.error { background: #c62828; }
        .snackbar.success { background: #2e7d32; }

        .snackbar svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ===== GALLERY SECTION ===== */
        .gallery-card {
            background: var(--md-surface);
            border-radius: var(--md-radius-lg);
            box-shadow: var(--md-shadow-1);
            border: 1px solid var(--md-border);
            overflow: hidden;
        }

        .gallery-toolbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--md-border);
        }

        .gallery-toolbar-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--md-text);
        }

        .gallery-toolbar-count {
            font-size: 12px;
            color: var(--md-text-hint);
            background: var(--md-bg);
            padding: 2px 8px;
            border-radius: var(--md-radius-pill);
            border: 1px solid var(--md-border);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1px;
            background: var(--md-border);
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--md-bg);
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .item-name {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-icon-delete {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            align-self: flex-start;
        }

        .btn-icon-delete:hover {
            background: rgba(217, 48, 37, 0.8);
            border-color: transparent;
        }

        .btn-icon-delete svg {
            width: 16px;
            height: 16px;
        }

        .gallery-empty {
            padding: 80px 24px;
            text-align: center;
        }

        .gallery-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: var(--md-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-empty-icon svg {
            width: 36px;
            height: 36px;
            color: var(--md-border);
        }

        .gallery-empty-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--md-text-secondary);
            margin-bottom: 6px;
        }

        .gallery-empty-sub {
            font-size: 13px;
            color: var(--md-text-hint);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .lightbox.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            border-radius: var(--md-radius);
            cursor: default;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .lightbox-close:hover { background: rgba(255,255,255,0.2); }

        .lightbox-close svg { width: 20px; height: 20px; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .item-enter {
            animation: itemEnter 0.3s ease forwards;
        }

        @keyframes itemEnter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--md-bg) 25%, #eee 50%, var(--md-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 600px) {
            .page-content { padding: 16px; }
            .upload-card { padding: 20px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

<!-- App Bar -->
<header class="app-bar">
    <div class="app-bar-inner">
        <div class="app-bar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
        </div>
        <div class="app-bar-title">フォト<span>ライブラリ</span></div>
        <div class="app-bar-spacer"></div>
        <div class="file-chip" id="fileChip">読み込み中...</div>
    </div>
</header>

<!-- Main -->
<div class="page-content">

    <!-- Upload Card -->
    <div class="upload-card">
        <div class="card-header">
            <div class="card-header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
                    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                </svg>
            </div>
            <div class="card-title">画像をアップロード</div>
        </div>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="drop-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
                    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                </svg>
            </div>
            <div class="drop-title">ここをクリックまたはドラッグ＆ドロップ</div>
            <div class="drop-hint">
                画像ファイルをアップロードできます
                <div class="format-chips">
                    <span class="format-chip">JPEG</span>
                    <span class="format-chip">PNG</span>
                    <span class="format-chip">GIF</span>
                </div>
            </div>
            <div class="btn-row" onclick="event.stopPropagation()">
                <button class="btn-outlined" onclick="document.getElementById('fileInput').click()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    ファイルを選択
                </button>
                <button class="btn-filled" id="uploadBtn" onclick="uploadFile()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                    アップロード
                </button>
            </div>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="onFileSelect(this)">

        <div class="selected-file" id="selectedFile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span class="selected-file-name" id="selectedFileName"></span>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-label-row">
                <span>アップロード中...</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="md-progress">
                <div class="md-progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <!-- Gallery Card -->
    <div class="gallery-card">
        <div class="gallery-toolbar">
            <div class="gallery-toolbar-title">アルバム</div>
            <div class="gallery-toolbar-count" id="galleryCount">0 枚</div>
        </div>
        <div id="gallery" class="gallery-grid"></div>
        <div id="emptyState" class="gallery-empty">
            <div class="gallery-empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="gallery-empty-title">画像がありません</div>
            <div class="gallery-empty-sub">アップロードした画像がここに表示されます</div>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightboxImg" src="" onclick="event.stopPropagation()">
</div>

<!-- Snackbar -->
<div class="snackbar" id="snackbar"></div>

<script>
    let selectedFile = null;

    // Drag & drop
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, ev => {
        ev.preventDefault(); dropZone.classList.add('drag-over');
    }));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => {
        ev.preventDefault(); dropZone.classList.remove('drag-over');
    }));
    dropZone.addEventListener('drop', ev => {
        const file = ev.dataTransfer.files[0];
        if (file) applyFile(file);
    });

    function applyFile(file) {
        selectedFile = file;
        document.getElementById('selectedFileName').textContent = file.name;
        document.getElementById('selectedFile').classList.add('visible');
        document.getElementById('uploadBtn').disabled = false;
    }

    function onFileSelect(input) {
        if (input.files[0]) applyFile(input.files[0]);
    }

    let snackTimer = null;
    function showSnackbar(msg, type = '') {
        const el = document.getElementById('snackbar');
        el.className = 'snackbar ' + type;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(snackTimer);
        snackTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    async function loadFiles() {
        const res = await fetch('/files');
        const files = await res.json();
        const gallery = document.getElementById('gallery');
        const empty = document.getElementById('emptyState');
        const count = files ? files.length : 0;

        document.getElementById('fileChip').textContent = count + ' 枚';
        document.getElementById('galleryCount').textContent = count + ' 枚';

        if (!files || count === 0) {
            gallery.innerHTML = '';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        gallery.innerHTML = files.map((f, i) => `
            <div class="gallery-item item-enter" style="animation-delay:${i * 0.03}s" onclick="openLightbox('/uploads/${f}')">
                <img src="/uploads/${f}" loading="lazy" alt="${f}">
                <div class="gallery-item-overlay">
                    <div class="item-name">${f}</div>
                    <button class="btn-icon-delete" onclick="event.stopPropagation(); deleteFile('${f}')" title="削除">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                    </button>
                </div>
            </div>
        `).join('');
    }

    async function deleteFile(name) {
        const res = await fetch('/files/' + name, { method: 'DELETE' });
        if (res.ok) {
            showSnackbar('✓ 削除しました', 'success');
            loadFiles();
        } else {
            showSnackbar('削除に失敗しました', 'error');
        }
    }

    async function uploadFile() {
        if (!selectedFile) return;
        const formData = new FormData();
        formData.append('file', selectedFile);

        const fill = document.getElementById('progressFill');
        const pct = document.getElementById('progressPct');
        const section = document.getElementById('progressSection');
        const btn = document.getElementById('uploadBtn');

        section.classList.add('visible');
        btn.disabled = true;

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/upload', true);

        xhr.upload.onprogress = (e) => {
            const p = Math.round((e.loaded / e.total) * 100);
            fill.style.width = p + '%';
            pct.textContent = p + '%';
        };

        xhr.onload = () => {
            setTimeout(() => {
                section.classList.remove('visible');
                fill.style.width = '0%';
            }, 500);

            if (xhr.status === 200) {
                showSnackbar('✓ アップロードが完了しました', 'success');
                selectedFile = null;
                document.getElementById('fileInput').value = '';
                document.getElementById('selectedFile').classList.remove('visible');
                btn.disabled = true;
                loadFiles();
            } else {
                showSnackbar('✕ ' + xhr.responseText, 'error');
                btn.disabled = false;
            }
        };

        xhr.onerror = () => {
            showSnackbar('✕ アップロードに失敗しました', 'error');
            btn.disabled = false;
        };

        xhr.send(formData);
    }

    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    loadFiles();
</script>
</body>
</html>
